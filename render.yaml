services:
  # Backend API + WebSockets
  - type: web
    name: papertradex-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://papertradex.vercel.app"
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        value: "https://papertradex.vercel.app"
