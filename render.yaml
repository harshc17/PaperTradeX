services:
  # Primary backend. Railway is the automatic backup; see docs/render-backup.md.
  - type: web
    name: PaperTradeX
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_FROM
        value: "harsh@papertradex.in"
      - key: MARKET_POLLING_ENABLED
        value: "true"
      - key: STANDBY_PRIMARY_URL
        value: ""
      - key: CORS_ORIGIN
        value: "https://papertradex.in,https://www.papertradex.in,https://papertradex.vercel.app"
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        value: "https://papertradex.in"
