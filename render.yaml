services:
  # Backend API + WebSockets
  - type: web
    name: papertradex-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --production
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: FRONTEND_URL
        value: "https://papertradex.vercel.app"
